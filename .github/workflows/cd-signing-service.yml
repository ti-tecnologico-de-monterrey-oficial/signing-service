name: CD · signing-service

# Los `paths` listan lo que entra en la imagen. Un cambio en el README, en las
# pruebas o en los .env de ejemplo no produce una imagen distinta, así que
# tampoco dispara un despliegue.

on:
  workflow_dispatch:
  push:
    branches: [develop, release, main]
    paths:
      - 'src/**'
      - '!src/**/*.test.js'
      - '!src/test-fixtures/**'
      - 'server.js'
      - 'healthcheck.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd-signing-service.yml'
      - '.github/workflows/_deploy-aca.yml'

jobs:
  dev:
    name: Desplegar a Dev
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-signing-devl
      ACA_ENVIRONMENT: Dev
    secrets: inherit

  release:
    name: Desplegar a PPRD
    if: github.ref_name == 'release'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-signing-pprd
      ACA_ENVIRONMENT: Pprd
    secrets: inherit

  main:
    name: Desplegar a Prod
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-signing-prod
      ACA_ENVIRONMENT: Prod
    secrets: inherit